<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}مروة Django Project{% endblock %}</title>
    <!-- Bootstrap للتنسيق السريع -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- شريط التنقل الثابت -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">موقع Django الخاص بي</a>
        </div>
    </nav>

    <!-- المحتوى المتغير لكل صفحة -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5 py-4 bg-light text-muted">
        <p>جميع الحقوق محفوظة © 2026</p>
    </footer>

</body>
</html>
